services:
  app_proxy:
    environment:
      APP_HOST: saltedlolly-npm-plus_launcher_1
      APP_PORT: 8080

  launcher:
    image: ghcr.io/saltedlolly/npmplus-launcher@sha256:f184f5cfe84148e326d925b69648001e7a329e6d51f3626e7b2cfebb09914016
    init: true
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    environment:
      CONFIG_DIR: /data/config
    volumes:
      - ${APP_SALTEDLOLLY_NPM_PLUS_DATA_DIR}/launcher-config:/data/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  npmplus:
    image: ghcr.io/saltedlolly/npmplus-wrapper@sha256:1488b1c7203f0d1836ef1817edeffaebb9ec480c7905df1bc425dfddaeeeab33
    restart: on-failure
    stop_grace_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Etc/UTC
      PUID: "1000"
      PGID: "1000"
      INITIAL_ADMIN_EMAIL: admin@umbrel.local
      INITIAL_ADMIN_PASSWORD: ${APP_PASSWORD}
      COOKIE_SECRET: ${APP_SALTEDLOLLY_NPM_PLUS_COOKIE_SECRET}
      INITIAL_DEFAULT_PAGE: "444"
      DISABLE_GRAVATAR: "true"
      # Integration secrets (passed to wrapper script)
      APP_SALTEDLOLLY_CROWDSEC_NPMPLUS_BOUNCER_KEY: ${APP_SALTEDLOLLY_CROWDSEC_NPMPLUS_BOUNCER_KEY}
      APP_SALTEDLOLLY_NPM_PLUS_AUTHENTIK_CLIENT_ID: ${APP_SALTEDLOLLY_NPM_PLUS_AUTHENTIK_CLIENT_ID}
      APP_SALTEDLOLLY_NPM_PLUS_AUTHENTIK_CLIENT_SECRET: ${APP_SALTEDLOLLY_NPM_PLUS_AUTHENTIK_CLIENT_SECRET}
    extra_hosts:
      # Allow NPMplus to access companion apps via host.docker.internal
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_SALTEDLOLLY_NPM_PLUS_ADMIN_PORT}:81/tcp"
      - "${APP_SALTEDLOLLY_NPM_PLUS_HTTP_PORT}:80/tcp"
      - "${APP_SALTEDLOLLY_NPM_PLUS_HTTPS_PORT}:443/tcp"
      - "${APP_SALTEDLOLLY_NPM_PLUS_HTTPS_PORT}:443/udp"
    volumes:
      - ${APP_SALTEDLOLLY_NPM_PLUS_DATA_DIR}:/data
      - ${APP_SALTEDLOLLY_NPM_PLUS_DATA_DIR}/launcher-config:/data/config:ro

  # Makes the Umbrel host resolvable as $DEVICE_DOMAIN_NAME from NPMplus,
  # matching the official Umbrel Nginx Proxy Manager package.
  docker-host:
    image: docker.io/qoomon/docker-host:3.3.1@sha256:ec9d214d7fa88932e9186ca2f4419d44661376929931248525b08e7fa9e270f7
    hostname: ${DEVICE_DOMAIN_NAME}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: on-failure
