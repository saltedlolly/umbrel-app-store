id: saltedlolly-npm-plus
category: networking
name: NPMplus
version: "2026-10-22-r1.1"
tagline: Publish your services with a modern, security-focused reverse proxy
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not install or work correctly yet. Check back soon.


  NPMplus makes it easy to publish services through a friendly web interface, with automatic TLS certificates, HTTP/3 support, access lists, stream forwarding, and advanced Nginx configuration.


  Security with CrowdSec: install the CrowdSec app from this app store and NPMplus connects to it automatically (restart NPMplus if you install CrowdSec afterwards). It then blocks IPs from CrowdSec's community blocklist, filters requests through CrowdSec's web application firewall to stop known exploits and attack probes, and sends its access logs to CrowdSec so repeat offenders such as scanners and brute-force attempts get banned. If CrowdSec is ever unavailable, your sites keep working.


  The NPMplus home screen shows your CrowdSec connection status and active ban counts, and lets you turn the integration off. It also has a setting for sites behind Cloudflare's proxy, so NPMplus sees each visitor's real IP address instead of Cloudflare's.


  ⚠️ Publishing a service makes it reachable from the internet. Protect every exposed service with appropriate authentication and keep both NPMplus and the upstream service updated.


  Open NPMplus from the Umbrel home screen for browser-based setup instructions and a button to launch its HTTPS administration interface. Your initial username is admin@umbrel.local and Umbrel displays the unique initial password in the app's credentials.


  Router port forwarding:


  - Forward external TCP port 80 to port 50080 on your Umbrel.

  - Forward external TCP port 443 to port 50443 on your Umbrel.

  - Forward external UDP port 443 to port 50443 on your Umbrel for HTTP/3.


  All NPMplus configuration, certificates, users, and proxy hosts are stored under this app's persistent data directory and survive app restarts and updates.


  ⚠️ Uninstalling this app deletes its persistent app data. Back it up before uninstalling or migrating an existing installation.
