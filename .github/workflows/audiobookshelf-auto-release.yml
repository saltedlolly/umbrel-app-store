name: Audiobookshelf - Auto Release

on:
  schedule:
    - cron: '0 6 * * *'   # every day 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check upstream and log the plan only (no build/push/commit)'
        type: boolean
        default: false
      force_version:
        description: 'Optional: pretend the eligible advplyr/audiobookshelf version is this (e.g. 2.37.0), for testing'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: audiobookshelf-auto-release
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check advplyr/audiobookshelf for an eligible release (5-day buffer)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_update: ${{ steps.compare.outputs.has_update }}
      eligible_version: ${{ steps.latest.outputs.eligible_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            saltedlolly-audiobookshelf/docker-containers/abs-manager/abs-server-image.txt
          sparse-checkout-cone-mode: false

      - name: Find newest advplyr/audiobookshelf release that has cleared the 5-day buffer
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '5 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          releases="$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/advplyr/audiobookshelf/releases?per_page=20")"

          version="$(echo "$releases" | jq -r --arg cutoff "$cutoff" '
            [ .[] | select(.draft==false and .prerelease==false and .published_at <= $cutoff) ]
            | sort_by(.published_at) | last | .tag_name // empty
          ')"
          version="${version#v}"

          if [[ -n "${{ github.event.inputs.force_version }}" ]]; then
            version="${{ github.event.inputs.force_version }}"
            echo "::notice::Overriding with force_version input: $version"
          fi

          if [[ -z "$version" ]]; then
            echo "::notice::No advplyr/audiobookshelf release has cleared the 5-day buffer yet"
            echo "eligible_version=" >> "$GITHUB_OUTPUT"
          else
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Unexpected version format: '$version'"
              exit 1
            fi
            echo "eligible_version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Get currently pinned ABS version
        id: current
        run: |
          set -euo pipefail
          TXT_FILE="saltedlolly-audiobookshelf/docker-containers/abs-manager/abs-server-image.txt"
          if [[ ! -f "$TXT_FILE" ]]; then
            echo "::error::abs-server-image.txt not found"
            exit 1
          fi
          current="$(grep -o ':[0-9]\+\.[0-9]\+\.[0-9]\+' "$TXT_FILE" | cut -d':' -f2)"
          if [[ -z "$current" ]]; then
            echo "::error::Could not extract pinned version from abs-server-image.txt"
            exit 1
          fi
          echo "current_version=$current" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        run: |
          eligible="${{ steps.latest.outputs.eligible_version }}"
          current="${{ steps.current.outputs.current_version }}"
          if [[ -z "$eligible" || "$eligible" == "$current" ]]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No update to publish. pinned=$current eligible=${eligible:-none}"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing update. pinned=$current -> eligible=$eligible"
          fi

  release:
    name: Build, smoke-test, and publish new version
    needs: check-upstream
    if: needs.check-upstream.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 3 sequential multi-arch builds vs cloudflare-ddns's 2
    permissions:
      contents: write
      packages: write
    env:
      APP_DIR: saltedlolly-audiobookshelf
      ELIGIBLE_VERSION: ${{ needs.check-upstream.outputs.eligible_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity for automated commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional, only add if you start hitting Docker Hub anonymous
      # pull-rate-limit failures on the base images (node:20-alpine,
      # node:18-alpine are pulled FROM Docker Hub during the build even
      # though we now push to GHCR). Uncomment and add
      # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets if needed:
      # - name: Log in to Docker Hub (pull-only, avoids rate limits)
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- OPTIONAL SAFETY NET ----------
      # Only abs-network-shares-config-tool is practically smoke-testable in
      # isolation: simple /health endpoint, no external runtime dependencies.
      # abs-manager needs a live Docker socket proxy to do anything useful,
      # and abs-network-shares-checker needs real mounted network shares to
      # report healthy — neither is practical to smoke-test standalone, so
      # those two images get NO automated safety net before publish. This is
      # a bigger gap than cloudflare-ddns's "arm64 not covered" caveat.
      - name: "[Optional] Smoke-test abs-network-shares-config-tool (linux/amd64)"
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            -t smoketest/abs-network-shares-config-tool:test \
            -f docker-containers/abs-network-shares-config-tool/Dockerfile \
            --load docker-containers/abs-network-shares-config-tool
          docker run -d --name config-tool-smoke -p 3001:3001 smoketest/abs-network-shares-config-tool:test
          ok=false
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/health >/dev/null && { ok=true; break; }
            sleep 2
          done
          docker logs config-tool-smoke || true
          docker rm -f config-tool-smoke || true
          [[ "$ok" == "true" ]] || { echo "::error::abs-network-shares-config-tool image failed smoke test"; exit 1; }
      # ---------- END OPTIONAL SAFETY NET ----------

      - name: Dry run summary (no build/push/commit)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "DRY RUN: would publish advplyr/audiobookshelf v${ELIGIBLE_VERSION}"

      - name: Build, push, pin digests, and publish (abs-build.sh)
        if: github.event.inputs.dry_run != 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          ./abs-build.sh --publish \
            --abs-version "${ELIGIBLE_VERSION}" \
            --notes "Automated update: bump bundled advplyr/audiobookshelf to v${ELIGIBLE_VERSION}"

      - name: Log published app version
        if: github.event.inputs.dry_run != 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "::notice::Published app version: $(grep '^version:' umbrel-app.yml)"

      - name: Prune old GHCR versions (keep last 5 tagged)
        if: github.event.inputs.dry_run != 'true'
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          package: 'abs-network-shares-config-tool,abs-manager,abs-network-shares-checker'
          keep-n-tagged: 5
