name: nito-dashboard - Build and publish

on:
  push:
    branches: [master]
    paths:
      - 'saltedlolly-nito/docker-containers/nito-dashboard/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: nito-dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true   # required for nito-build.sh's `git push`

      - name: Configure git identity for automated commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: saltedlolly-nito/docker-containers/nito-dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/saltedlolly/nito-dashboard:${{ steps.sha.outputs.short }}
            ghcr.io/saltedlolly/nito-dashboard:latest

      - name: Pin the new dashboard image and publish
        working-directory: saltedlolly-nito
        run: |
          ./nito-build.sh --publish \
            --dashboard-tag "${{ steps.sha.outputs.short }}" \
            --dashboard-digest "${{ steps.build.outputs.digest }}" \
            --notes "Update the dashboard"
