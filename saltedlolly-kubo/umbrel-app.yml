id: saltedlolly-kubo
category: files
name: Kubo IPFS
version: "v0.43.2"
tagline: Run a full IPFS node with the official WebUI for peers, pins, and files
description: >-
  Kubo is the reference implementation of IPFS (InterPlanetary File System) - a peer-to-peer network for storing and sharing content-addressed data. This app runs a full Kubo node with its official web interface for managing peers, pinning and browsing content, and monitoring bandwidth and repository usage.


  This is a from-scratch package, built independently rather than derived from any existing community Kubo package.


  ⚠️ The node's admin interface (WebUI + API) is only reachable through Umbrel's own login - it is never exposed directly, matching upstream's own guidance that this port grants full admin-level control of the node.


  ⚠️ Pinned and imported content is stored as Kubo's own internal block database, not as ordinary files - it cannot be browsed, previewed, or copied through Umbrel's Files app. This data is backed up by Umbrel's Backup tool while the app is installed, but - unlike this app's own settings - it is deleted if you uninstall the app. Take a Backup first if you want to keep it.


  The peer-to-peer (swarm) port is published normally so this node can find and be found by other IPFS peers. The public Gateway (port 8395) is also exposed, so anyone who reaches it can fetch content through this node - a deliberate tradeoff for being able to actually use IPFS links, not an oversight.
releaseNotes: >-
  ## v0.43.2

  - Automated update: bump Kubo to v0.43.2


  --- ipfs/kubo upstream release notes (auto-updated) ---


  ipfs/kubo v0.43.2

    This is a bugfix release.

    🚒 Nodes no longer stop accepting inbound connections

    **Problem:** A node that accepts inbound connections could stop taking new peers after it had run for a while.

    **Reason:** If an inbound connection closed after its security handshake but before libp2p passed it to the node, the [resource manager](https://github.com/ipfs/kubo/blob/master/docs/libp2p-resource-management.md) kept the connection and file descriptor reservations for it. No socket stayed open, but these reservations added up until they filled `System.ConnsInbound`. From then on the node refused every new inbound connection, even when only a few connections were live. AutoNAT also started to report the node's addresses as unreachable, because the dial-backs were refused too. On busy public nodes this leaked thousands of reservations per day, and the default limit filled within hours to days. A restart cleared the reservations, but they built up again.

    **Fix:** [go-libp2p v0.52.0](https://github.com/libp2p/go-libp2p/releases/tag/v0.52.0) fixes the leak ([libp2p/go-libp2p#3564](https://github.com/libp2p/go-libp2p/issues/3564)).

    If you raised `System.ConnsInbound` in `libp2p-resource-limit-overrides.json` or scheduled restarts to work around this, you can remove those changes after you upgrade.

    📦️ Dependency updates

    - update `go-libp2p` to [0.52.0](https://github.com/libp2p/go-libp2p/releases/tag/0.52.0)

    📝 Changelog

