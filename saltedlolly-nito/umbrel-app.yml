  NitoNetwork/Nito-core v3.0.0

    ⚠️ MANDATORY UPDATE - Hard Fork at Block 750,000

    All nodes MUST update before block 750,000 to remain on the main chain.

    | Current Block | Activation Block | Estimated Time |
    |---------------|------------------|----------------|
    | ~688,000 | 750,000 | ~43 days |

    ---

    What's New in v3.0.0

    🔓 Re-enable Legacy & P2SH Addresses (Block 750,000)
    After block 750,000, the network will accept Legacy (P2PKH) and P2SH-SegWit transactions:
    - Mining pool compatibility (Yiimp, MPOS, etc.)
    - Exchange integration
    - Legacy wallet support

    🖥️ GUI Updates
    - Legacy and P2SH address types appear in wallet dropdown after activation

    🔒 Security Updates
    - New checkpoints at blocks 550,000, 600,000, 650,000, 687,000

    **Source Code:** https://github.com/NitoNetwork/Nito-core/tree/v3.0.0

    ---

    Upgrade Instructions

    1. Stop your node: `nito-cli stop`
    2. Backup your wallet.dat
    3. Download and extract the new version
    4. Start your node: `nitod` or `nito-qt`
    5. Verify: `nito-cli getnetworkinfo | grep subversion` → `/Nito:3.0.0/`

    ---

    For Mining Pools (After Block 750,000)
    ```bash
    nito-cli getnewaddress "pool" legacy
    ```

    ---

    Behavior Before & After Block 750,000

    | Feature | Before 750,000 | After 750,000 |
    |---------|----------------|---------------|
    | Send to Legacy/P2SH | ❌ Blocked | ✅ Allowed |
    | GUI Legacy dropdown | ❌ Hidden | ✅ Visible |
    | Coinbase to Legacy | ✅ Allowed | ✅ Allowed |
    | Bech32 (SegWit) | ✅ Allowed | ✅ Allowed |

