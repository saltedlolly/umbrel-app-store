path: ""

defaultUsername: ""
defaultPassword: ""
# Makes sure the dashboard can save its history (see hooks/pre-start)
hooks:
  pre-start: hooks/pre-start
# The blockchain can be downloaded again, so it's left out of Umbrel backups
# (same as Umbrel's Bitcoin app). Kept: nito.conf, peers.dat, banlist.json,
# settings.json, mempool.dat and the dashboard's history, all small. Paths
# are relative to the app's folder; mainnet is data/nito itself.
backupIgnore:
  - data/nito/blocks
  - data/nito/chainstate
  - data/nito/indexes
  - data/nito/debug.log
  - data/nito/testnet3/blocks
  - data/nito/testnet3/chainstate
  - data/nito/testnet3/indexes
  - data/nito/testnet3/debug.log
  - data/nito/regtest

