tagline: A fair-launch, SHA-256 proof-of-work blockchain built for 200-year longevity
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  Nito is a decentralized, SHA-256 proof-of-work blockchain built around fairness and longevity: no premine, no ICO, no VC allocation - just open, permissionless mining from block one. This app runs a full Nito node with the standard nito-cli/JSON-RPC interface, alongside a dashboard showing block height, sync progress, peers, and mempool activity.


  - Faster, more responsive than Bitcoin - 1-minute blocks with real-time, per-block damped difficulty adjustment, rather than Bitcoin's ~2-week retarget window

  - Genuinely scarce, unlike Dogecoin - a 200-year emission schedule with a hard cap (~1.28B NITO) that reaches zero, rather than Dogecoin's permanent, uncapped inflation

  - Bitcoin's mining ecosystem, not Litecoin's - SHA-256 proof-of-work taps the same mature, efficient ASIC hardware market Bitcoin uses, rather than Litecoin's Scrypt

  - Deliberately simple, unlike DigiByte - a single mining algorithm by design, on the premise that a smaller consensus surface is easier to secure and reason about than coordinating five

  - Taproot and Schnorr signatures (BIP 340-342) have been active since genesis

  - Protocol changes go through a public Nito Improvement Proposal (NIP) process, with miner signaling required for activation


  All node data (chain state) is stored under this app's persistent data directory and survives restarts and updates. Uninstalling this app deletes it - back up first if you want to keep it.
releaseNotes: >-
  v3.0.1.4:

  - Fix docker-nito's entrypoint crash-looping on a fresh Umbrel install: nito.conf couldn't be written because the container started directly as UID 1000, but Umbrel's bind-mounted data directory is created root-owned. The image now starts as root, fixes ownership, then drops privileges before running nitod.


  --- NitoNetwork/Nito-core upstream release notes (auto-updated) ---


  NitoNetwork/Nito-core v3.0.1

    Nito Core v3.0.1 - Maintenance Update

    Non-mandatory update. No consensus changes, no hard fork. All nodes will continue to work on v3.0.0

    ---

    What's New in v3.0.1

    🔒 Checkpoint Fix & Updates
    - Added 5 new checkpoints: 700,000 / 725,000 / 750,000 / 775,000 / 790,000
    - Updated `defaultAssumeValid` to block 790,000 (faster initial sync)
    - Updated `chainTxData` with current chain statistics


    📝 Other
    - Updated MAX_MONEY to match actual total supply (1,284,565,890 NITO)
    - Updated README with improved build instructions

    **Source Code:** https://github.com/NitoNetwork/Nito-core/tree/v3.0.1

    ---

    Upgrade Instructions

    1. Stop your node: `nito-cli stop`
    2. Download and extract the new version
    3. Start your node: `nitod` or `nito-qt`
    4. Verify: `nito-cli getnetworkinfo | grep subversion` → `/Nito:3.0.1/`

    No wallet backup required — this update does not affect wallet data.

