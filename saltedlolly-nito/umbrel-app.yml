manifestVersion: 1
id: saltedlolly-nito
category: blockchain
name: Nito
version: "v4.0.0.1"
tagline: A fair-launch, SHA-256 proof-of-work blockchain built for 200-year longevity
description: >-
  Nito is a decentralized, SHA-256 proof-of-work blockchain built around fairness and longevity: no premine, no ICO, no VC allocation - just open, permissionless mining from block one. This app runs a full Nito node with the standard nito-cli/JSON-RPC interface, alongside a dashboard that shows new blocks as they're found, sync progress, charts of recent blocks, and a map of the countries your peers are in.


  - Faster, more responsive than Bitcoin - 1-minute blocks with real-time, per-block damped difficulty adjustment, rather than Bitcoin's ~2-week retarget window

  - Genuinely scarce, unlike Dogecoin - a 200-year emission schedule with a hard cap (~1.28B NITO) that reaches zero, rather than Dogecoin's permanent, uncapped inflation

  - Bitcoin's mining ecosystem, not Litecoin's - SHA-256 proof-of-work taps the same mature, efficient ASIC hardware market Bitcoin uses, rather than Litecoin's Scrypt

  - Deliberately simple, unlike DigiByte - a single mining algorithm by design, on the premise that a smaller consensus surface is easier to secure and reason about than coordinating five

  - Taproot and Schnorr signatures (BIP 340-342) have been active since genesis

  - Protocol changes go through a public Nito Improvement Proposal (NIP) process, with miner signaling required for activation


  Help the network: forward port 8820 (TCP) on your router to your Umbrel, so other nodes can connect to yours. The dashboard reminds you if nobody has connected in, and the README explains how: https://github.com/saltedlolly/umbrel-app-store/tree/master/saltedlolly-nito#help-the-network-open-port-8820


  All node data (chain state) is stored under this app's persistent data directory and survives restarts and updates. Uninstalling this app deletes it. The blockchain isn't included in Umbrel backups, because the node can download it again: after a restore it resyncs from the network.
releaseNotes: >-
  ## v4.0.0.1

  - The dashboard has a new panel for the Orchard upgrade: what it adds, a countdown to block 1,165,432 with the expected date, how many of your peers are ready, and links to learn more. It stays for a month after the upgrade happens.

  ## v4.0.0

  - Nito Core v4.0.0, a required upgrade: every Nito node must run it before block 1,165,432, around the end of December 2026. It adds optional Orchard private transactions.

  - The first time the node starts on v4 it builds its new Orchard index, which takes a while and uses some extra disk space.

  - Once your node has started on v4 it can't go back to v3.

  - The blockchain is no longer included in Umbrel backups, because your node can download it again. After a restore it resyncs from the network.

  - Built with docker-nito v4.0.0-2: https://github.com/Nito-Tools/docker-nito/releases/tag/v4.0.0-2


  --- NitoNetwork/Nito-core upstream release notes (auto-updated) ---


  NitoNetwork/Nito-core v4.0.0

    # Nito Core 4.0.0

    Nito Core 4.0.0 introduces opt-in Orchard private transactions with direct Bech32x addresses while preserving Nito's transparent transaction, block, SHA-256 mining and pool behavior.

    Upgrade requirement

    Node, pool, explorer and indexer operators must upgrade their backing Nito daemon before mainnet block **1,165,432**. After activation, Orchard-capable peers require protocol `70017` or later and the `NITO_PRIVATE` service.

    Back up every wallet and stop the existing node cleanly before upgrading. Existing v3 Berkeley DB and SQLite wallet files remain supported, but reopening v4-updated wallet or chain data with v3 is not a supported rollback procedure.

    Major additions

    - Orchard private transactions and explicit `nito1x...` Bech32x receive addresses.
    - Transparent-to-private, private-to-transparent and private-to-private transfers.
    - Native v4 recovery phrases covering deterministic transparent and Orchard authority.
    - Guided `nito-cli -interactive` workflows for sensitive wallet, recovery, signing and backup operations.
    - Orchard indexing and recovery support, including operation on explicitly configured pruned nodes.
    - Incoming transparent transaction details with resolved input addresses in Qt.
    - Official packages for Linux x86_64, Linux aarch64, Windows win64 and macOS arm64.

    Documentation

    - [Complete release notes](https://github.com/NitoNetwork/Nito-core/blob/6eaeea13dd1f2ed761b42ad9f1696b727b4c85aa/doc/release-notes.md)
    - [Quick start](https://github.com/NitoNetwork/Nito-core/blob/v4.0.0/doc/nito/quick-start.md)
    - [Wallet backup and recovery](https://github.com/NitoNetwork/Nito-core/blob/v4.0.0/doc/nito/wallet-backup-restore.md)
    - [Wallet creation and V3 migration](https://github.com/NitoNetwork/Nito-core/blob/v4.0.0/doc/managing-wallets.md)

    Verification and provenance

    Verify downloads against the attached `SHA256SUMS` file before installation. The `v4.0.0` tag is an annotated SSH-signed tag verified by GitHub and targets commit `e3ff5e42b980c792ee5ab790610772a7d9ee8f8a`.

    This release was built from commit `e3ff5e42b980c792ee5ab790610772a7d9ee8f8a` by [GitHub Actions run 43697543547](https://github.com/NitoNetwork/Nito-core/actions/runs/43697543547).

    GitHub automatically provides source-code archives generated from the `v4.0.0` tag. The attached checksum index covers the six downloadable platform packages and is explicitly **unsigned**.


  See the full release history: https://github.com/NitoNetwork/Nito-core/releases

