manifestVersion: 1
id: saltedlolly-nostr-backup-relay
category: social
name: Nostr Backup Relay
version: "v1.2.1.3"
tagline: Back up the Nostr activity of all your accounts to your own private relay
description: >-
  UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  Nostr Backup Relay is a private Nostr relay that backs up everything you post, from as many Nostr accounts as you like. It is a fork of Umbrel's official Nostr Relay app, built from Umbrel's v1.2.1 code, with one addition: "Sync from public relays" accepts several NIP-05 or npub addresses instead of one, so a personal account and a project account can both be backed up. It is not made or supported by Umbrel.


  Step 1. Connect your Nostr clients (for example Damus, Amethyst or Primal) to your private relay, so new activity is saved as you post it. Use the Relay URL shown at the top of the app's page.


  Step 2. Open the app, click the globe icon and add each account's NIP-05 or npub address. Past and future activity of every account is copied from its public relays in the background, even when your clients aren't connected to your private relay.


  If the official Nostr Relay app is installed, this app copies its backup and saved account the first time it starts, so nothing already backed up is lost. You can keep both apps installed while you check everything is there, then uninstall the official one.


  Powered by nostr-rs-relay, the same relay engine and version as the official app. Umbrel's code is used under the PolyForm Noncommercial License 1.0.0. Setup help and details: https://github.com/saltedlolly/umbrel-app-store/blob/master/saltedlolly-nostr-backup-relay/README.md
releaseNotes: >-
  ## v1.2.1.3

  - A Zap button in the footer for tips in sats: it shows a QR code and the Lightning address zaps@olly.st, opens your wallet, or links to zap @olly.st on Nostr. The app is free; zaps are a way to say thanks.

  ## v1.2.1.2

  - A dashboard for each account: Total actions has a column per account, and each account has its own panel with a More view. Profile updates show the old and new avatar, banner and name, and relay list updates show which relays were added and removed. Links in posts are clickable, with share cards and images. Reposts have their own card. Actions saved by accounts you don't sync can be deleted. Fix: an account added while the app was running wasn't synced from some public relays until they reconnected.

  ## v1.2.1.1

  - First release: Umbrel's Nostr Relay v1.2.1 with support for backing up more than one account, and a one-time copy of the official app's backup on first start.


  --- Umbrel Nostr Relay upstream release notes (auto-updated) ---


  Umbrel Nostr Relay 1.2.1-patch.1

    This update includes important security improvements. We recommend updating as soon as possible.

    If you're updating from before v1.2.1, the first startup may take longer while your database is upgraded automatically. Newly received events with expiration timestamps are removed after they expire.


  See the full release history: https://github.com/getumbrel/umbrel-apps/commits/master/nostr-relay

