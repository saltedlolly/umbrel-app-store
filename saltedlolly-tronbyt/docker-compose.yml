services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: saltedlolly-tronbyt_server_1
      APP_PORT: 8000
      # Tronbyt has its own login system, and physical Tidbyt/Tronbyt devices
      # poll this server directly (no browser, can't complete Umbrel SSO) -
      # this is a permanent setting, not a local-test toggle.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/tronbyt/server:2.6.1@sha256:279af92ffaece6f2e7259fbfd8bd82487dc1135ba705727a2f8f27c2fa2a67b1
    container_name: saltedlolly-tronbyt_server_1
    hostname: saltedlolly-tronbyt_server_1
    init: true
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "/app/tronbyt-server", "health"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 10s
