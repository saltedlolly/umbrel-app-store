category: networking
name: CrowdSec
version: "v1.8.1.14"
tagline: Crowd-sourced intrusion detection and IP banning for your self-hosted apps
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  CrowdSec watches for attacks (brute-force logins, scans, known-bad IPs) against your self-hosted services and automatically bans them, sharing and benefiting from threat intelligence crowd-sourced across the whole CrowdSec community.


  This app runs the CrowdSec engine plus a local web dashboard (crowdsec-web-ui) for browsing alerts, managing bans, and viewing metrics - no command line required.


  CrowdSec decides who to block, but something facing your traffic has to do the blocking. Install the NPMplus app from this app store and the two connect automatically, with no setup (restart NPMplus if you install it first). NPMplus then:


  - Blocks IPs on CrowdSec's community blocklist and any IPs CrowdSec bans itself.

  - Filters every request through CrowdSec's web application firewall, which stops known exploits and common attack probes.

  - Sends its access logs to CrowdSec, so repeat offenders such as scanners and brute-force attempts are spotted and banned.


  If CrowdSec is ever unavailable, NPMplus lets traffic through, so your sites keep working. Other services with their own CrowdSec bouncer can be connected too (see the app's README).


  Some apps' own mobile clients can look like bots to CrowdSec (for example Audiobookshelf apps syncing a library) and get banned by mistake. The README explains how to lift a ban and add a whitelist to stop it happening again: https://github.com/saltedlolly/umbrel-app-store/tree/master/saltedlolly-crowdsec#stopping-false-bans-of-your-own-apps-whitelists


  ⚠️ Uninstalling this app deletes its persistent app data, including your ban history and dashboard account. Back it up before uninstalling.
releaseNotes: >-
  ## v1.8.1.14

  - LAPI and AppSec are no longer reachable from your local network, only from other apps on the Umbrel (requires NPMplus 2026-07-24-r1.21 or later)

  ## v1.8.1.13

  - README: how to stop CrowdSec falsely banning your own apps (with an Audiobookshelf example), linked from the description

  ## v1.8.1.12

  - App store description updated to explain the automatic NPMplus integration

  ## v1.8.1.11

  - Analyse NPMplus access logs (sent over syslog) to detect scanners, brute force and aggressive crawlers; removes the old log mount, which never worked

  ## v1.8.1.10

  - Enable AppSec (Web Application Firewall) on port 7422: blocks known CVE exploits and common attack probes for NPMplus

  ## v1.8.1.9

  - Fix crash-loop for anyone who installed v1.8.1.7 (removes the invalid AppSec config on start) + fix web UI always showing unhealthy

  ## v1.8.1.8

  - Disable AppSec auto-enable (caused crash-loop)

  ## v1.8.1.7

  - Enable AppSec (Web Application Firewall) automatically
  - Adds 200+ CVE virtual patches for vulnerability protection
  - AppSec listener on port 7422 for NPMplus WAF integration
  - Zero configuration - enabled on first start

  ## v1.8.1.6

  - Automated update: crowdsec 1.8.1, crowdsec-web-ui 2026.9.1

  ## v1.8.1.5

  - Fix NPMplus bouncer key - use shared entropy derivation

  ## v1.8.1.4

  - Fix NPMplus integration - bind ports to all interfaces (0.0.0.0)
  - Allows Docker containers to access LAPI/AppSec via gateway IP
  - Required for NPMplus container to connect to CrowdSec
  - Still secure: LAPI requires authentication via bouncer key

  ## v1.8.1.3

  - Add NPMplus integration support
  - Expose LAPI (port 8080) and AppSec (port 7422) on localhost for NPMplus
  - Auto-mount NPMplus logs for analysis (read-only)
  - Add NPMplus log acquisition configuration

  ## v1.8.1.2

  - Mark app as under construction while bouncer/enforcement chain is verified

  ## v1.8.1.1

  - Initial release


