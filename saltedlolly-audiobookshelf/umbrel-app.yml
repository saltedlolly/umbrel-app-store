releaseNotes: >-
  ## 2.37.1.7

  - Fixes the config tool showing "Audiobookshelf is starting up" every few minutes after automatic imports are switched on. While Audiobookshelf starts, the config tool now shows how long it has been starting, how long it usually takes, and why large libraries on a network share take a while

  ## 2.37.1.6

  - New: automatic imports from network shares. Books you copy to your NAS from another computer now appear in Audiobookshelf automatically, scanning only the books that changed. Switch it on in the ABS Network Shares Config Tool (needs an Audiobookshelf API key). A light nightly check catches anything your NAS doesn't report. The config tool now follows your device's light or dark mode

  ## 2.37.1.5

  - More security hardening; settings are saved more safely; Audiobookshelf's log lines keep appearing in the app logs

  ## 2.37.1.4

  - Audiobookshelf can now start without internet access; tidier start and stop scripts; the network shares page image is smaller and no longer has access to Docker

  ## 2.37.1.3

  - Fixes the version shown on the network shares page and a false Update available notice; the notice is easier to read in dark mode

  ## 2.37.1.2

  - Security fix

  ## 2.37.1.1

  - Network shares page: light and dark themes with a picker in the footer, an Update available notice, a Report Issue button that fills in the app and version, and a tidier footer on phones and tablets

  ## 2.37.1

  - Automated update: bump bundled advplyr/audiobookshelf to v2.37.1


