version: "3.7"

services:
  app_proxy:
    environment:
      # ABS Network Shares Config Tool is primary (accessible via dashboard icon on port 23378)
      APP_HOST: saltedlolly-audiobookshelf_abs-network-shares-config-tool_1
      APP_PORT: 3001
      PROXY_AUTH_ADD: "true"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # App-specific name: a generic "docker-socket-proxy" could clash with
    # another app's container of the same name
    container_name: saltedlolly-audiobookshelf_docker-socket-proxy_1
    restart: unless-stopped
    environment:
      - CONTAINERS=1      # Allow container read operations
      - POST=1            # Allow POST requests (container create/start)
      - DELETE=1          # Allow DELETE requests (container remove)
      - IMAGES=1          # Allow image inspect required by container create
      - NETWORKS=0
      - VOLUMES=0
      - INFO=1            # Allow /info for health/status
      - EVENTS=1          # Allow /events for monitoring
      - AUTH=0
      - SYSTEM=0
      - SERVICES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Only on the app's private network: other apps' containers on the
    # shared Umbrel network can't reach the Docker API
    networks:
      - docker-proxy
    # No published port: abs-manager and the config tool reach the proxy as
    # saltedlolly-audiobookshelf_docker-socket-proxy_1:2375 on the app network. Publishing 2375 made the
    # Docker API reachable without a password from every device on the LAN.

  # Lightweight UI service for managing and monitoring required network shares selection
  # Accessible via app_proxy on port 23378 (or via Umbreldashboard icon)
  abs-network-shares-config-tool:
    image: ghcr.io/saltedlolly/abs-network-shares-config-tool@sha256:9a5092eab28b545b0fbac285ff0f3c7acbfb0c25dcf8949dae79cd9ded9e9292
    container_name: saltedlolly-audiobookshelf_abs-network-shares-config-tool_1
    hostname: saltedlolly-audiobookshelf_abs-network-shares-config-tool_1
    init: true
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - APP_DATA_DIR=${APP_DATA_DIR}
      - NODE_ENV=production
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Mount the Umbrel network storage root (read-only) so we can discover shares
      - ${UMBREL_ROOT}/network:/umbrel-network:ro
    networks:
      - default
      - docker-proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s

  # Tells Audiobookshelf about books added, changed or removed on network
  # shares (its own folder watcher can't see changes made from other
  # computers). Switched on and set up from the network shares page.
  abs-share-watcher:
    image: ghcr.io/saltedlolly/abs-share-watcher@sha256:db03b20a32fa9bceeca2acc89c38167ea1461eecb3e2bd508903df849f39205d
    container_name: saltedlolly-audiobookshelf_abs-share-watcher_1
    init: true
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Same path as Audiobookshelf uses, so library folder paths match
      - ${UMBREL_ROOT}/network:/media/network:ro

  # Background service that manages starting Audiobookshelf. At launch, it runs abs-network-share-waiter-checker  
  # repeatedly which checks all required networkshares are accessible and starts abs-server only once they are.
  abs-manager:
    image: ghcr.io/saltedlolly/abs-manager@sha256:acd45ff595dba8b9511667364fe8028a24726dfd8067d25e8846fb7bd2f20c3a
    container_name: saltedlolly-audiobookshelf_abs-manager_1
    restart: unless-stopped
    environment:
      - APP_DATA_DIR=${APP_DATA_DIR}
      - UMBREL_ROOT=${UMBREL_ROOT}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - docker-proxy

networks:
  # Private network for the Docker socket proxy and the two containers that
  # use it (internal: no outside access)
  docker-proxy:
    internal: true
