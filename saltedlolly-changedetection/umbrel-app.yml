  dgtlmoon/changedetection.io 0.70.2

    What's Changed
    * MCP - "MCP Note" sub-tab, set what assistants are told when they connect by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4670
    * MCP - More monitor settings, test notifications, word diffs, and permission rows for notifications and browser steps by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4669
    * MCP OAuth - Claude Code can sign in: loopback redirect URIs match on any port (RFC 8252 7.3) by @kris-anderson in https://github.com/dgtlmoon/changedetection.io/pull/4673
    * Clear history - don't fail when a save renames its .tmp file away mid-clear by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4674
    * MCP - "Public MCP address" setting, separate from the notification Base URL by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4676
    * gitignore: local AI configs to avoid credential leaks by @skkzsh in https://github.com/dgtlmoon/changedetection.io/pull/4677
    * Fix two races behind flaky tests: favicon cache, and a new monitor queued twice by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4681
    * CI - Third-party licence list: regenerate weekly and on release, drift is only a warning on PRs by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4684
    * MCP - Clearer tool descriptions (list_tags, list_notifications, notification_services, restock_status, limit/offset) by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4678
    * MCP plugins - their own permission rows, a tool 'area', and open_world by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4679
    * MCP - "Allow read-only access without sign-in" setting, for public demos by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4680
    * AI settings - saving no longer switches off checkboxes the page didn't show by @kris-anderson in https://github.com/dgtlmoon/changedetection.io/pull/4683
    * AI settings - API key field could not be typed in by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4687
    * API - Watch list and search show each watch's paused and notification_muted by @dgtlmoon in https://github.com/dgtlmoon/changedetection.io/pull/4686

    New Contributors
    * @kris-anderson made their first contribution in https://github.com/dgtlmoon/changedetection.io/pull/4673

