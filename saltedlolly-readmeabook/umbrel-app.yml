manifestVersion: 1.1
id: saltedlolly-readmeabook
category: media
name: ReadMeABook
version: "v1.2.3"
tagline: Request and automatically download audiobooks
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  ReadMeABook is an audiobook request and automation service: search for a book, request it, and let ReadMeABook find a release through Prowlarr, send it to your download client, organize the files, and add it to Audiobookshelf or Plex.


  - Works with Audiobookshelf and Plex

  - Searches torrent and Usenet indexers through Prowlarr

  - Supports qBittorrent, Transmission, SABnzbd, NZBGet and Deluge

  - Includes multi-user requests, approval workflows and notifications

  - BookDate recommends audiobooks with an optional AI-powered swipe interface

  - Can merge multi-file chapter downloads into a single M4B


  Audiobookshelf NAS Edition integration is built in: its local audiobook folder and Umbrel-mounted network shares are available inside ReadMeABook, and the local server can be reached at http://10.21.0.1:13378. For security, you still copy an Audiobookshelf API token once and select the library during ReadMeABook's setup wizard.


  Prowlarr and a supported download client are also required. Downloads use Umbrel's shared Downloads folder so the official Umbrel download-client apps and ReadMeABook see the same files at /downloads/audiobooks.


  See the app README for the complete setup guide, including local and NAS library paths.
releaseNotes: >-
  ## v1.2.3

  - Automated update: bump ReadMeABook to v1.2.3


  --- kikootwo/ReadMeABook upstream release notes (auto-updated) ---


  kikootwo/ReadMeABook v1.2.3

    🎉  Release v1.2.3


    **Fixes:**
    - ✅ Hardcoded JWT fallback enables forged administrator tokens
       - https://github.com/kikootwo/ReadMeABook/issues/297
       - Installs running outside the official Docker image, including the Proxmox VE helper script, should update now (Proxmox: run `update` in the container). Users on those installs are signed out once.
       - Docker installs were not affected.
    - ✅ Search / Download stopping at 50
       - https://github.com/kikootwo/ReadMeABook/issues/151
       - Requests beyond the first 50 are now processed in rotating batches, and RSS matching covers every request awaiting search
    - ✅ Search truncates to 100 results *before* dedup and ranking, silently dropping the best releases
       - https://github.com/kikootwo/ReadMeABook/issues/262
       - The full deduplicated result set is now ranked before the 100-result cap is applied
    - ✅ Deleting a request removes a directory rebuilt from the current template, not the one it created
       - https://github.com/kikootwo/ReadMeABook/issues/265
       - Deletion now uses the path stored when the book was organized
    - ✅ A rate-limited indexer grab marks the request permanently `failed` instead of trying the next release
       - https://github.com/kikootwo/ReadMeABook/issues/267
       - After a 429 or 5xx grab response, the next ranked release is tried automatically

      **Upgrade:**
      ```bash
      docker pull ghcr.io/kikootwo/readmeabo
      docker compose down
      docker compose up -d
      ```


    What's Changed
    * Fix search and download processing stopping at 50 by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/274
    * Fix rate-limited grabs by trying the nwo inhttps://github.com/kikootwo/ReadMeABook/pull/275
    * Fix request deletion to use stored media path by @kikootwo in
    https://github.com/kikootwo/ReadMeABook/
    * Rank search results before applying result cap by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/277
    * Fix/jwt secret derivation by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/301


  See the full release history: https://github.com/kikootwo/ReadMeABook/releases

