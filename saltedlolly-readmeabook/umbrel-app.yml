tagline: Request and automatically download audiobooks
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  ReadMeABook is an audiobook request and automation service: search for a book, request it, and let ReadMeABook find a release through Prowlarr, send it to your download client, organize the files, and add it to Audiobookshelf or Plex.


  - Works with Audiobookshelf and Plex

  - Searches torrent and Usenet indexers through Prowlarr

  - Supports qBittorrent, Transmission, SABnzbd, NZBGet and Deluge

  - Includes multi-user requests, approval workflows and notifications

  - BookDate recommends audiobooks with an optional AI-powered swipe interface

  - Can merge multi-file chapter downloads into a single M4B


  Audiobookshelf NAS Edition integration is built in: its local audiobook folder and Umbrel-mounted network shares are available inside ReadMeABook, and the local server can be reached at http://10.21.0.1:13378. For security, you still copy an Audiobookshelf API token once and select the library during ReadMeABook's setup wizard.


  Prowlarr and a supported download client are also required. Downloads use Umbrel's shared Downloads folder so the official Umbrel download-client apps and ReadMeABook see the same files at /downloads/audiobooks.


  See the app README for the complete setup guide, including local and NAS library paths.


  Icon artwork is sourced from https://github.com/selfhst/icons and used under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). It has been adapted with additional internal spacing for UmbrelOS. Application names and logos remain the property of their respective owners.
releaseNotes: >-
  ## v1.3.0

  - Automated update: bump ReadMeABook to v1.3.0


  --- kikootwo/ReadMeABook upstream release notes (auto-updated) ---


  kikootwo/ReadMeABook v1.3.0

    🎉  Release v1.3.0


    > **Before you update:**
    >
    > - **Sign in once after updating.** The new sign-in limits remember browsers that have signed in with the password since the update, and such a browser can still sign in while its account is at its limit.
    > - **Behind a reverse proxy,** make sure it passes the client address (`X-Forwarded-For`), or all visitors share one address limit.
    > - **Scripts that call the sign-in endpoints** must send `Content-Type: application/json`.
    > - **Scripts that read job payloads or stored download links** from the request detail, request list or recent-requests responses will no longer find them.
    > - **Nothing changes for file placement or metadata until you pick a new option,** and the Explicit mark is off until you turn it on.

    **Features:**
    - ✅ a Library page for everything in your library and everything requested
       - https://github.com/kikootwo/ReadMeABook/issues/177
       - https://github.com/kikootwo/ReadMeABook/pull/572
       - https://github.com/kikootwo/ReadMeABook/pull/578
       - linked from the header for every signed-in user: every book in your Plex or Audiobookshelf library and every audiobook requested through RMAB, each book once, as a cover grid with search, filters for status, source and requester, sort and group by author. Books on the way update live.
       - click a book for its details. Admins and the requester also see the error, the download size, the request history and the actions; everyone else sees the book and who asked for it.
    - ✅ hard links and metadata.opf for Audiobookshelf imports
       - https://github.com/kikootwo/ReadMeABook/issues/68
       - https://github.com/kikootwo/ReadMeABook/pull/597
       - in Audiobookshelf mode, Settings > Paths has a new Library files section. File placement: Copy (as before), Hard link (copy if not possible) or Hard link only (don't import if not possible). Metadata: Tags in the audio files (as before), OPF file (metadata.opf) or None. A hard link puts the book in your library without a second copy on disk, so the download keeps seeding from the same file. Ebooks still copy, and Plex mode is unchanged.
       - with hard links the audio files are never changed: choose OPF file or None, and turn chapter merge off. When a book can't be linked, "Hard link (copy if not possible)" copies it and the Paths page shows the last book that was copied instead; "Hard link only" imports nothing and the request says why.
       - one mount: hard links only work when the downloads folder and the media folder are on the same filesystem and reach RMAB through one mount, such as one `/data` volume holding both `/data/downloads` and `/data/media`. Two separate volumes, even on the same disk, can't be linked; neither can separate ZFS datasets, btrfs subvolumes or Unraid pools.
       - caution: don't use Audiobookshelf's Embed Metadata on linked books. It writes into the shared file, so it changes the download too.
       - in every mode, deleting a request now also removes a `metadata.opf` left alone in the book folder, as it already did for `cover.jpg`
    - ✅ an admin adds a magnet link or a .torrent file to a request
       - https://github.com/kikootwo/ReadMeABook/pull/596
       - https://github.com/kikootwo/ReadMeABook/pull/290
       - Thanks https://github.com/zpersichetti !
       - Add Torrent in the admin request menu, on audiobook requests that are pending, awaiting search, awaiting release or failed, with qBittorrent, Transmission and Deluge. The download, import and notifications then run as usual.
       - once it finishes, a torrent added this way seeds until you remove it in your client; cancelling the request while it is still downloading removes it. Admin sessions only: API tokens can't use it.
    - ✅ select several requests in the admin table and approve, deny, cancel or delete them together
       - https://github.com/kikootwo/ReadMeABook/issues/212
       - https://github.com/kikootwo/ReadMeABook/pull/589
       - a checkbox on each row and one in the header for the whole page. Each button shows how many selected requests it applies to, with a Stop button while it runs and a result that lists what was skipped and why.
       - bulk delete never touches a book that is in your library or being imported. A deleted request comes back if a watched author or series, or a synced shelf, still lists it: remove that first, or cancel instead.
    - ✅ choose the download client category
       - https://github.com/kikootwo/ReadMeABook/issues/46
       - https://github.com/kikootwo/ReadMeABook/pull/587

    … (truncated) Full release notes: https://github.com/kikootwo/ReadMeABook/releases/tag/v1.3.0


  See the full release history: https://github.com/kikootwo/ReadMeABook/releases

