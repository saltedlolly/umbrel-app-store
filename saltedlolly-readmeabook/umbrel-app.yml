category: media
name: ReadMeABook
version: "v1.2.10"
tagline: Request and automatically download audiobooks
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  ReadMeABook is an audiobook request and automation service: search for a book, request it, and let ReadMeABook find a release through Prowlarr, send it to your download client, organize the files, and add it to Audiobookshelf or Plex.


  - Works with Audiobookshelf and Plex

  - Searches torrent and Usenet indexers through Prowlarr

  - Supports qBittorrent, Transmission, SABnzbd, NZBGet and Deluge

  - Includes multi-user requests, approval workflows and notifications

  - BookDate recommends audiobooks with an optional AI-powered swipe interface

  - Can merge multi-file chapter downloads into a single M4B


  Audiobookshelf NAS Edition integration is built in: its local audiobook folder and Umbrel-mounted network shares are available inside ReadMeABook, and the local server can be reached at http://10.21.0.1:13378. For security, you still copy an Audiobookshelf API token once and select the library during ReadMeABook's setup wizard.


  Prowlarr and a supported download client are also required. Downloads use Umbrel's shared Downloads folder so the official Umbrel download-client apps and ReadMeABook see the same files at /downloads/audiobooks.


  See the app README for the complete setup guide, including local and NAS library paths.


  Icon artwork is sourced from https://github.com/selfhst/icons and used under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). It has been adapted with additional internal spacing for UmbrelOS. Application names and logos remain the property of their respective owners.
releaseNotes: >-
  ## v1.2.10

  - Automated update: bump ReadMeABook to v1.2.10


  --- kikootwo/ReadMeABook upstream release notes (auto-updated) ---


  kikootwo/ReadMeABook v1.2.10

    🎉  Release v1.2.10


    > **If you use an external Redis:** `REDIS_URL` must be a valid URL, such as `redis://:password@redis:6379/0`. The updated Redis client (ioredis 5.11) rejects malformed URLs and out-of-range ports. The built-in Redis is unaffected.

    **Features:**
    - ✅ imported audiobooks carry the Audible description and genres as tags
       - https://github.com/kikootwo/ReadMeABook/issues/208
       - https://github.com/kikootwo/ReadMeABook/pull/419
       - https://github.com/kikootwo/ReadMeABook/pull/397
       - Thanks https://github.com/N0cky !
       - with metadata tagging on, M4B files are also marked as an audiobook with gapless playback. Audiobookshelf shows the description and lists each genre separately.

    **Fixes:**
    - ✅ torrents added to qBittorrent 5.2 or later are no longer reported as failed grabs
       - https://github.com/kikootwo/ReadMeABook/issues/317
       - https://github.com/kikootwo/ReadMeABook/pull/420
       - https://github.com/kikootwo/ReadMeABook/pull/295
       - Thanks https://github.com/ColeTown !
       - hybrid (v1+v2) torrents and base32 magnets still are; that's tracked in https://github.com/kikootwo/ReadMeABook/issues/422
    - ✅ SABnzbd downloads no longer fail with "Download path not available" when they reach 100% before post-processing has finished
       - https://github.com/kikootwo/ReadMeABook/pull/421
       - https://github.com/kikootwo/ReadMeABook/pull/306
       - Thanks https://github.com/connor2k !

      **Upgrade:**
      ```bash
      docker pull ghcr.io/kikootwo/readmeabook:latest
      docker compose down
      docker compose up -d
      ```


    What's Changed
    * chore(deps-dev): update dev tooling within current majors to clear 18 Dependabot alerts by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/418
    * feat: write description, genre, media type and gapless tags (#208) by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/419
    * chore(deps): stop Dependabot proposing vitest majors by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/417
    * chore(deps-dev): bump jsdom from 27.4.0 to 29.1.1 by @dependabot[bot] in https://github.com/kikootwo/ReadMeABook/pull/414
    * chore(deps-dev): bump @testing-library/jest-dom from 6.9.1 to 7.0.1 by @dependabot[bot] in https://github.com/kikootwo/ReadMeABook/pull/415
    * chore(deps): bump ioredis from 5.8.2 to 5.11.1 in the npm-minor-patch group by @dependabot[bot] in https://github.com/kikootwo/ReadMeABook/pull/413

    … (truncated) Full release notes: https://github.com/kikootwo/ReadMeABook/releases/tag/v1.2.10


