name: ReadMeABook
version: "v1.2.6"
tagline: Request and automatically download audiobooks
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  ReadMeABook is an audiobook request and automation service: search for a book, request it, and let ReadMeABook find a release through Prowlarr, send it to your download client, organize the files, and add it to Audiobookshelf or Plex.


  - Works with Audiobookshelf and Plex

  - Searches torrent and Usenet indexers through Prowlarr

  - Supports qBittorrent, Transmission, SABnzbd, NZBGet and Deluge

  - Includes multi-user requests, approval workflows and notifications

  - BookDate recommends audiobooks with an optional AI-powered swipe interface

  - Can merge multi-file chapter downloads into a single M4B


  Audiobookshelf NAS Edition integration is built in: its local audiobook folder and Umbrel-mounted network shares are available inside ReadMeABook, and the local server can be reached at http://10.21.0.1:13378. For security, you still copy an Audiobookshelf API token once and select the library during ReadMeABook's setup wizard.


  Prowlarr and a supported download client are also required. Downloads use Umbrel's shared Downloads folder so the official Umbrel download-client apps and ReadMeABook see the same files at /downloads/audiobooks.


  See the app README for the complete setup guide, including local and NAS library paths.


  Icon artwork is sourced from https://github.com/selfhst/icons and used under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). It has been adapted with additional internal spacing for UmbrelOS. Application names and logos remain the property of their respective owners.
releaseNotes: >-
  ## v1.2.6

  - Automated update: bump ReadMeABook to v1.2.6


  --- kikootwo/ReadMeABook upstream release notes (auto-updated) ---


  kikootwo/ReadMeABook v1.2.6

    🎉  Release v1.2.6


    **Fixes:**
    - ✅ Details modal shows Audible's ~300-char blurb instead of the full summary
       - https://github.com/kikootwo/ReadMeABook/issues/324
       - https://github.com/kikootwo/ReadMeABook/pull/360
       - Thanks https://github.com/sean0407 !
       - book details now show the full Audnexus summary, keeping its paragraphs, line breaks and list bullets
    - ✅ Goodreads shelf links checked more strictly
       - https://github.com/kikootwo/ReadMeABook/pull/365
       - shelf feeds are only fetched from goodreads.com over https. Older `http://` and bare `goodreads.com` links are fixed up automatically, so existing shelves keep syncing. Recommended update.
    - ✅ saved passwords stored encrypted and kept with their server
       - https://github.com/kikootwo/ReadMeABook/pull/366
       - download client passwords are always stored encrypted. When you change the OIDC issuer, an Apprise or ntfy server address, or the BookDate provider or custom URL, RMAB asks you to re-enter that secret. Recommended update.
    - ✅ bcrypt 6
       - https://github.com/kikootwo/ReadMeABook/pull/368
       - bcrypt now ships its own prebuilt binaries, which drops an old install-time downloader and the outdated packages it brought in (including tar 6). Existing passwords keep working.

      **Upgrade:**
      ```bash
      docker pull ghcr.io/kikootwo/readmeabook:latest
      docker compose down
      docker compose up -d
      ```


    What's Changed
    * chore(e2e): add an end-to-end test harness by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/364
    * fix: only fetch Goodreads shelf feeds from Goodreads over https by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/365
    * fix: store download client passwords encrypted and keep saved secrets with their server by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/366
    * fix: show the full book summary from Audnexus, keeping its paragraphs by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/367
    * chore(deps): update bcrypt to 6 by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/368
    * chore: release v1.2.6 by @kikootwo in https://github.com/kikootwo/ReadMeABook/pull/369


    **Full Changelog**: https://github.com/kikootwo/ReadMeABook/compare/v1.2.5...v1.2.6


  See the full release history: https://github.com/kikootwo/ReadMeABook/releases

