name: ReadMeABook
version: "v1.2.11"
tagline: Request and automatically download audiobooks
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  ReadMeABook is an audiobook request and automation service: search for a book, request it, and let ReadMeABook find a release through Prowlarr, send it to your download client, organize the files, and add it to Audiobookshelf or Plex.


  - Works with Audiobookshelf and Plex

  - Searches torrent and Usenet indexers through Prowlarr

  - Supports qBittorrent, Transmission, SABnzbd, NZBGet and Deluge

  - Includes multi-user requests, approval workflows and notifications

  - BookDate recommends audiobooks with an optional AI-powered swipe interface

  - Can merge multi-file chapter downloads into a single M4B


  Audiobookshelf NAS Edition integration is built in: its local audiobook folder and Umbrel-mounted network shares are available inside ReadMeABook, and the local server can be reached at http://10.21.0.1:13378. For security, you still copy an Audiobookshelf API token once and select the library during ReadMeABook's setup wizard.


  Prowlarr and a supported download client are also required. Downloads use Umbrel's shared Downloads folder so the official Umbrel download-client apps and ReadMeABook see the same files at /downloads/audiobooks.


  See the app README for the complete setup guide, including local and NAS library paths.


  Icon artwork is sourced from https://github.com/selfhst/icons and used under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). It has been adapted with additional internal spacing for UmbrelOS. Application names and logos remain the property of their respective owners.
releaseNotes: >-
  ## v1.2.11

  - Automated update: bump ReadMeABook to v1.2.11


  --- kikootwo/ReadMeABook upstream release notes (auto-updated) ---


  kikootwo/ReadMeABook v1.2.11

    🎉  Release v1.2.11


    **Features:**
    - ✅ organized audiobooks also get the publisher, subtitle and language tags
       - https://github.com/kikootwo/ReadMeABook/issues/208
       - https://github.com/kikootwo/ReadMeABook/pull/440
       - https://github.com/kikootwo/ReadMeABook/pull/426
       - Thanks https://github.com/N0cky !
       - with metadata tagging on, from Audible (M4B, MP3 and FLAC). The language is written as its name ("English"), replacing an existing "eng".

    **Fixes:**
    - ✅ Manual and Bulk Import bring in every disc of a book stored in Disc/CD folders, as one book
       - https://github.com/kikootwo/ReadMeABook/issues/434
       - https://github.com/kikootwo/ReadMeABook/pull/443
       - importing a book from its own library folder now stops with nothing changed, and the request shows as failed
    - ✅ multi-disc books keep disc-then-track order when merged, copied and renamed
       - https://github.com/kikootwo/ReadMeABook/issues/331
       - https://github.com/kikootwo/ReadMeABook/pull/443
       - https://github.com/kikootwo/ReadMeABook/pull/294
       - Thanks https://github.com/ColeTown !
       - with metadata tagging on, each file also gets its disc and track number, so players such as Audiobookshelf play it in order
    - ✅ updated zod (request validation) to version 4, which includes the fix for advisory GHSA-mrhx-c7xc-m3w5
       - https://github.com/kikootwo/ReadMeABook/pull/444
       - validation errors return only each issue's code, field, message and limits, and some codes and messages changed (for example, `invalid_enum_value` is now `invalid_value`). An API token's expiry date must include seconds, as the web UI already sends. Text length limits count characters as written (an emoji counts once), and a cover image URL with surrounding whitespace is stored trimmed.
    - ✅ seeded-torrent cleanup and request delete no longer remove a torrent that was already in your download client
       - https://github.com/kikootwo/ReadMeABook/issues/423
       - https://github.com/kikootwo/ReadMeABook/pull/441
       - the post-import category is only applied to RMAB's own torrents. Torrents grabbed before this release are kept unless the client's added time shows RMAB added them.
       - downloads still in progress when you upgrade won't get the post-import category. After switching to a new client of the same type, RMAB won't clean torrents it grabbed before.
    - ✅ the Cleanup Seeded Torrents job checks every finished download, not just the first 100
       - https://github.com/kikootwo/ReadMeABook/issues/258
       - https://github.com/kikootwo/ReadMeABook/pull/441
       - https://github.com/kikootwo/ReadMeABook/pull/321
       - Thanks https://github.com/ZillaGit104 !
       - it stops early if the download client doesn't answer, and stops re-checking torrents that are already gone
    - ✅ Transmission: a tracker warning no longer fails the download
       - https://github.com/kikootwo/ReadMeABook/issues/286
       - https://github.com/kikootwo/ReadMeABook/pull/436
       - https://github.com/kikootwo/ReadMeABook/pull/321

    … (truncated) Full release notes: https://github.com/kikootwo/ReadMeABook/releases/tag/v1.2.11


  See the full release history: https://github.com/kikootwo/ReadMeABook/releases

