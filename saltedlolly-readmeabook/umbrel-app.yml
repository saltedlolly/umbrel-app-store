name: ReadMeABook
version: "v1.2.12"
tagline: Request and automatically download audiobooks
description: >-
  ⚠️ UNDER CONSTRUCTION: this app is still being tested and may not work correctly yet. Check back soon.


  ReadMeABook is an audiobook request and automation service: search for a book, request it, and let ReadMeABook find a release through Prowlarr, send it to your download client, organize the files, and add it to Audiobookshelf or Plex.


  - Works with Audiobookshelf and Plex

  - Searches torrent and Usenet indexers through Prowlarr

  - Supports qBittorrent, Transmission, SABnzbd, NZBGet and Deluge

  - Includes multi-user requests, approval workflows and notifications

  - BookDate recommends audiobooks with an optional AI-powered swipe interface

  - Can merge multi-file chapter downloads into a single M4B


  Audiobookshelf NAS Edition integration is built in: its local audiobook folder and Umbrel-mounted network shares are available inside ReadMeABook, and the local server can be reached at http://10.21.0.1:13378. For security, you still copy an Audiobookshelf API token once and select the library during ReadMeABook's setup wizard.


  Prowlarr and a supported download client are also required. Downloads use Umbrel's shared Downloads folder so the official Umbrel download-client apps and ReadMeABook see the same files at /downloads/audiobooks.


  See the app README for the complete setup guide, including local and NAS library paths.


  Icon artwork is sourced from https://github.com/selfhst/icons and used under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). It has been adapted with additional internal spacing for UmbrelOS. Application names and logos remain the property of their respective owners.
releaseNotes: >-
  ## v1.2.12

  - Automated update: bump ReadMeABook to v1.2.12


  --- kikootwo/ReadMeABook upstream release notes (auto-updated) ---


  kikootwo/ReadMeABook v1.2.12

    🎉  Release v1.2.12


    > **If you might roll back to v1.2.11:** this release adds two database columns. Before downgrading, turn off "Check Watched Lists" in Admin > Jobs and remove or switch any "New releases only" watches, or the older build requests their whole backlog.

    **Features:**
    - ✅ watch an author or series for new releases only
       - https://github.com/kikootwo/ReadMeABook/issues/302
       - https://github.com/kikootwo/ReadMeABook/pull/451
       - watching now asks: Entire catalog (the default, as before) or New releases only, which requests books released from today on (preorders count) and skips undated books. Each watch can be changed later from the Profile cards.
       - adding one watch now checks only that author or series, not every watch
    - ✅ the automatic ebook fetch skips a book whose folder already holds an ebook
       - https://github.com/kikootwo/ReadMeABook/issues/313
       - https://github.com/kikootwo/ReadMeABook/pull/496
       - covers the auto-grab after an audiobook import and the nightly missing-ebooks job. A lone PDF booklet, or a folder that another book also uses, does not count. Manual Fetch Ebook, Interactive Search and Manual Import are unchanged.
       - this is one part of #313; importing ebook files already on your system is still open there

    **Fixes:**
    - ✅ automatic search stops grabbing the wrong book
       - https://github.com/kikootwo/ReadMeABook/issues/223
       - https://github.com/kikootwo/ReadMeABook/pull/459
       - stricter title and author matching: numbers in the title must match, author names match as whole words, and one-word titles are checked more strictly. Subtitles after a colon and author initials match better. Interactive search still lists every result.
    - ✅ automatic search skips a release numbered as another book of the same series
       - https://github.com/kikootwo/ReadMeABook/issues/330
       - https://github.com/kikootwo/ReadMeABook/pull/482
       - https://github.com/kikootwo/ReadMeABook/pull/307
       - Thanks https://github.com/connor2k !
       - uses the book's series position from Audible, unless the release names the book by its own title. Interactive search still lists everything.
    - ✅ automatic search skips releases far too small for the book's runtime
       - https://github.com/kikootwo/ReadMeABook/pull/479
       - https://github.com/kikootwo/ReadMeABook/pull/311
       - Thanks https://github.com/H0tChicken !
       - such as one chapter file of a multi-file Usenet post. Interactive search still lists these.
    - ✅ search and ranking handle titles with apostrophes
       - https://github.com/kikootwo/ReadMeABook/issues/316
       - https://github.com/kikootwo/ReadMeABook/pull/469
       - https://github.com/kikootwo/ReadMeABook/pull/304
       - Thanks https://github.com/connor2k !
       - Thanks https://github.com/Eyji !
       - Thanks https://github.com/thehaven !

    … (truncated) Full release notes: https://github.com/kikootwo/ReadMeABook/releases/tag/v1.2.12


  See the full release history: https://github.com/kikootwo/ReadMeABook/releases

