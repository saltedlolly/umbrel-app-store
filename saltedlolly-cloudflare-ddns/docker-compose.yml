services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: saltedlolly-cloudflare-ddns_ui_1
      APP_PORT: 3000

  ui:
    image: ghcr.io/saltedlolly/cloudflare-ddns-ui@sha256:b8fcd08ec6d577cc5b49af9faecc5f450da09220d0be54a9af278983c9ab462d
    container_name: saltedlolly-cloudflare-ddns_ui_1
    hostname: saltedlolly-cloudflare-ddns_ui_1
    init: true
    restart: unless-stopped
    environment:
      - APP_DATA_DIR=/data
      - NODE_ENV=production
    volumes:
      - cloudflare-ddns-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  cloudflare-ddns:
    image: ghcr.io/saltedlolly/cloudflare-ddns@sha256:b05eb5cabd225ae5354cee365fc3fd247d92f05af69247fb7a0622baea81b0d4
    container_name: saltedlolly-cloudflare-ddns_cloudflare-ddns_1
    hostname: saltedlolly-cloudflare-ddns_cloudflare-ddns_1
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      - APP_DATA_DIR=/data
      # RECORD_COMMENT is favonia/cloudflare-ddns's single fallback comment
      # setting for records it manages - it applies to both A and AAAA
      # records, so this alone covers IPv4 and IPv6. Purely a label visible
      # in the Cloudflare dashboard (no effect on DNS resolution); makes it
      # obvious to anyone who logs into Cloudflare directly that this
      # record is managed by this app, not something to edit by hand.
      - RECORD_COMMENT=Updated by Cloudflare DDNS for Umbrel
    volumes:
      - cloudflare-ddns-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /data/status.json && grep -q '\"status\": \"running\"' /data/status.json || exit 1"]
      interval: 1m
      timeout: 20s
      retries: 6
    depends_on:
      - ui

volumes:
  cloudflare-ddns-data:
