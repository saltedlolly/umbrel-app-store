releaseNotes: >-
  v1.17.1.6:

  - Fix critical bug where GET /api/config endpoint truncated notifier URLs at the second '=' character (e.g. Uptime Kuma push URLs with query strings like ?status=up&msg=OK&ping= were silently cut to just ?status). This is a second instance of the same bug fixed in v1.17.1.4 - that fix only covered the readEnv() function but missed the GET endpoint.

  v1.17.1.5:

  - Add clear error messages for HTTPS certificate validation failures with local URLs (localhost/umbrel.local). UI now warns when saving HTTPS localhost URLs; logs show helpful guidance to switch to HTTP for self-signed certificates.

  v1.17.1.4:

  - Fix a real bug where any config value containing more than one '=' character (e.g. an Uptime Kuma push URL's own query string, ?status=up&msg=OK&ping=) got silently truncated right after the second '=' every time the config was read back - readEnv() split each line on every '=' instead of just the first one. Values with multiple '=' now round-trip intact.

  v1.17.1.3:

  - Fix a real race condition where saving notifier settings could silently wipe out a just-configured Uptime Kuma/Healthchecks/Shoutrrr URL: the config-save endpoint now does a true partial merge (a field the client doesn't send keeps its existing value) instead of requiring every save to resend a complete snapshot. Also stop logging "NEW TOKEN CONFIGURED" on saves that don't actually change the token, and add blank-line separators around each child process restart in the log for readability.

  v1.17.1.2:

  - Fix "Cloudflare Last Updated" ticking upward every few seconds: the update-detection logic re-scanned a sliding window of recent log lines on every 3-second poll, re-stamping the same already-counted event as "just now" for as long as it stayed in that window. Now scans only lines added since the last check, and treats the first successful confirmation after startup as the update time (matching startup time when records already matched), updating thereafter only on a genuine record change.

  v1.17.1.1:

  - Set a DNS record comment ("Updated by Cloudflare DDNS for Umbrel") on managed A/AAAA records, so it's clear in the Cloudflare dashboard which app manages them

  v1.17.1:

  - Update to favonia/cloudflare-ddns v1.17.1; fix the staleness warning going stale forever after the first check, and IPv6 status detection breaking against a favonia/cloudflare-ddns wording change

  v1.17.1:

  - Update to favonia/cloudflare-ddns v1.17.1; fix the staleness warning going stale forever after the first check, and IPv6 status detection breaking against a favonia/cloudflare-ddns wording change

  v1.15.1.4:

  - Migrate image hosting to GitHub Container Registry

  v1.15.1.3:

  - Fix bug in version badge in ui

  v1.15.1.2:

  - Switch to new versioning build system


  v1.2.6:

  - move images to app store gallery repo. add app store screenshot.
  - move logo inside ui. 
  - tweak dashboard icon. 


  v1.2.5:

  - Improve status display to better support IPv6 addresses.


  v1.2.0:

  - Add support for detecting IPv6 addresses, if the system supports it. Required the container to use `network_mode: host`.


  v1.1.0:

  - Fix Notifier section - URLs now save correctly. Hopefully Notifiers should now be working.


  v1.0.8:

  - Add version badge in footer for easier debugging; gets baked into the image at build time.


  v1.0.7:

  - Add IPv4/IPv6 support toggles in UI


  --- favonia/cloudflare-ddns upstream release notes (auto-updated) ---


  favonia/cloudflare-ddns v1.17.1

    This release improves Cloudflare trace IP detection, adds a GitHub Container Registry mirror, and makes configuration errors easier to diagnose.

    Improvements

    - **More resilient IP detection.** The built-in `cloudflare.trace` provider now tries multiple [Cloudflare endpoints](README.markdown#ip-detection) and uses the first validated response, allowing detection to succeed when an endpoint is slow or unavailable. This also removes `cloudflare.trace:<url>`, an unofficial workaround for [past temporary Cloudflare server outages](https://github.com/favonia/cloudflare-ddns/issues/985). ([#1262](https://github.com/favonia/cloudflare-ddns/pull/1262), [#1263](https://github.com/favonia/cloudflare-ddns/pull/1263))
    - **GHCR mirror.** Docker images are also available at `ghcr.io/favonia/cloudflare-ddns`, with the same tags as Docker Hub and cosign verification for release images. ([#1264](https://github.com/favonia/cloudflare-ddns/pull/1264))
    - **Clearer domain validation.** Domain names with empty interior labels are now rejected with correction guidance. Names accepted after removing leading or extra trailing dots now produce warnings showing the effective spelling. ([#1268](https://github.com/favonia/cloudflare-ddns/pull/1268))
    - **Hints for incomplete IPv6 host IDs.** Startup diagnostics now suggest a valid IPv6 spelling for invalid `hostid6` values missing leading colons. ([#1282](https://github.com/favonia/cloudflare-ddns/pull/1282))


  favonia/cloudflare-ddns v1.17.0

    This release adds experimental controls for per-domain IPv6 host IDs and detected-address filtering, and makes advanced configuration easier to validate. It also removes the startup token-verification request that produced misleading warnings for valid account API tokens.

    Highlights

    1. **Per-domain IPv6 host IDs.** Advanced IPv6 setups can now control the host bits of each domain's `AAAA` records by adding the experimental `hostid6` field to entries in `DOMAINS` or `IP6_DOMAINS`, for example `example.org{hostid6=::1}`. A domain can preserve the detected host bits, replace them with a fixed host ID, or derive one from a MAC address. This changes only `AAAA` record derivation; WAF lists continue to use the raw detected prefixes. ([#1224](https://github.com/favonia/cloudflare-ddns/pull/1224))
    2. **IPv4 and IPv6 detection filters.** New experimental `IP4_DETECTION_FILTER` and `IP6_DETECTION_FILTER` expressions select detected addresses before both DNS and WAF reconciliation. If a filter removes every address for one family, the updater preserves that family's existing managed content for the round. ([#1231](https://github.com/favonia/cloudflare-ddns/pull/1231))
    3. **Advisory linting for `PROXIED`.** The updater now warns about suspicious boolean expressions, including constant results and redundant or subsumed terms. ([#1235](https://github.com/favonia/cloudflare-ddns/pull/1235))
    4. **Account API tokens no longer trigger misleading startup warnings.** The updater no longer calls Cloudflare's user-token verification endpoint during startup. Malformed token values are still rejected locally. A well-formed token that is invalid or lacks permission for an attempted DNS or WAF operation is instead reported when that operation fails, with the corresponding permission guidance. ([#1240](https://github.com/favonia/cloudflare-ddns/pull/1240))

    Other Notable Changes

    Features

    - New `SHOUTRRR_FILE` reads Shoutrrr notification URLs from a file, making mounted secrets usable without putting token-bearing URLs in environment values. If `SHOUTRRR` and `SHOUTRRR_FILE` are both set, they must specify the same URLs. ([#1241](https://github.com/favonia/cloudflare-ddns/pull/1241))

    Bug Fixes

    - When both `HEALTHCHECKS` and `UPTIMEKUMA` are configured, a failure from either service no longer prevents the updater from contacting the other. ([#1249](https://github.com/favonia/cloudflare-ddns/pull/1249))

    Message Improvements

    - **Expanded operator feedback.** Configuration checks now catch likely token-file mixups and warn about additional cases of family-specific settings being ignored because their provider is disabled. Diagnostics for Shoutrrr URLs containing spaces now identify the configuration source, report the correct line number, and give clearer guidance on how to fix the issue. Shoutrrr success logs now identify the notification type. ([#1204](https://github.com/favonia/cloudflare-ddns/pull/1204)) ([#1227](https://github.com/favonia/cloudflare-ddns/pull/1227)) ([#1230](https://github.com/favonia/cloudflare-ddns/pull/1230)) ([#1250](https://github.com/favonia/cloudflare-ddns/pull/1250))


  See the full release history: https://github.com/favonia/cloudflare-ddns/releases

