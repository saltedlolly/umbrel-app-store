id: saltedlolly-cloudflare-ddns
name: Cloudflare DDNS
tagline: Dynamic DNS client for Cloudflare to keep your domain updated with your changing IP address.
icon: https://raw.githubusercontent.com/saltedlolly/umbrel-app-store/master/saltedlolly-cloudflare-ddns/icon.png
category: networking
version: "v1.18.0"
port: 4100
description: >-
  Keeps your Cloudflare DNS records pointing at your home's current public IP address, so a domain such as home.example.com keeps working when your internet provider changes your IP. Powered by favonia/cloudflare-ddns.


  Features:


  - A simple web page, behind Umbrel's login, for entering your Cloudflare API token and the names to keep updated, and for checking that everything is working.


  - Shows your public IP, when Cloudflare was last updated, the state of each domain, and the live log. Explains what is wrong when a domain can't be updated.


  - Switches for Proxied, IPv4 and IPv6, and an Enable/Disable button. Asks before changes that could break a website or publish your home IP address.


  - Optional notifications through Healthchecks, Uptime Kuma or Shoutrrr (Discord, ntfy, Slack and more).


  - IPv6 is off by default: with Proxied on, Cloudflare already serves visitors over IPv6. See the README for when to turn it on.


  Setup instructions and troubleshooting: [README](https://github.com/saltedlolly/umbrel-app-store/tree/master/saltedlolly-cloudflare-ddns#readme)

