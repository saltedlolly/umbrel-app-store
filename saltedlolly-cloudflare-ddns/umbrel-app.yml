releaseNotes: >-
  ## v1.17.1.8

  - Settings UI updated to Node 24 (security fixes; Node 18 is end of life)

  ## v1.17.1.7

  - Add helpful log message when notifier requests fail due to umbrel.local hostname resolution issues. When connection failures are detected and any notifier URL uses 'umbrel.local', the log now suggests switching to 'localhost' for better reliability. Applies to all notifiers (Uptime Kuma, Healthchecks, Shoutrrr).

  ## v1.17.1.6

  - Fix critical bug where GET /api/config endpoint truncated notifier URLs at the second '=' character (e.g. Uptime Kuma push URLs with query strings like ?status=up&msg=OK&ping= were silently cut to just ?status). This is a second instance of the same bug fixed in v1.17.1.4 - that fix only covered the readEnv() function but missed the GET endpoint.

  ## v1.17.1.5

  - Add clear error messages for HTTPS certificate validation failures with local URLs (localhost/umbrel.local). UI now warns when saving HTTPS localhost URLs; logs show helpful guidance to switch to HTTP for self-signed certificates.

  ## v1.17.1.4

  - Fix a real bug where any config value containing more than one '=' character (e.g. an Uptime Kuma push URL's own query string, ?status=up&msg=OK&ping=) got silently truncated right after the second '=' every time the config was read back - readEnv() split each line on every '=' instead of just the first one. Values with multiple '=' now round-trip intact.

  ## v1.17.1.3

  - Fix a real race condition where saving notifier settings could silently wipe out a just-configured Uptime Kuma/Healthchecks/Shoutrrr URL: the config-save endpoint now does a true partial merge (a field the client doesn't send keeps its existing value) instead of requiring every save to resend a complete snapshot. Also stop logging "NEW TOKEN CONFIGURED" on saves that don't actually change the token, and add blank-line separators around each child process restart in the log for readability.

  ## v1.17.1.2

  - Fix "Cloudflare Last Updated" ticking upward every few seconds: the update-detection logic re-scanned a sliding window of recent log lines on every 3-second poll, re-stamping the same already-counted event as "just now" for as long as it stayed in that window. Now scans only lines added since the last check, and treats the first successful confirmation after startup as the update time (matching startup time when records already matched), updating thereafter only on a genuine record change.

  ## v1.17.1.1

  - Set a DNS record comment ("Updated by Cloudflare DDNS for Umbrel") on managed A/AAAA records, so it's clear in the Cloudflare dashboard which app manages them

  ## v1.17.1

  - Update to favonia/cloudflare-ddns v1.17.1; fix the staleness warning going stale forever after the first check, and IPv6 status detection breaking against a favonia/cloudflare-ddns wording change


  --- favonia/cloudflare-ddns upstream release notes (auto-updated) ---


  favonia/cloudflare-ddns v1.17.1

    This release improves Cloudflare trace IP detection, adds a GitHub Container Registry mirror, and makes configuration errors easier to diagnose.

    Improvements

    - **More resilient IP detection.** The built-in `cloudflare.trace` provider now tries multiple [Cloudflare endpoints](README.markdown#ip-detection) and uses the first validated response, allowing detection to succeed when an endpoint is slow or unavailable. This also removes `cloudflare.trace:<url>`, an unofficial workaround for [past temporary Cloudflare server outages](https://github.com/favonia/cloudflare-ddns/issues/985). ([#1262](https://github.com/favonia/cloudflare-ddns/pull/1262), [#1263](https://github.com/favonia/cloudflare-ddns/pull/1263))
    - **GHCR mirror.** Docker images are also available at `ghcr.io/favonia/cloudflare-ddns`, with the same tags as Docker Hub and cosign verification for release images. ([#1264](https://github.com/favonia/cloudflare-ddns/pull/1264))
    - **Clearer domain validation.** Domain names with empty interior labels are now rejected with correction guidance. Names accepted after removing leading or extra trailing dots now produce warnings showing the effective spelling. ([#1268](https://github.com/favonia/cloudflare-ddns/pull/1268))
    - **Hints for incomplete IPv6 host IDs.** Startup diagnostics now suggest a valid IPv6 spelling for invalid `hostid6` values missing leading colons. ([#1282](https://github.com/favonia/cloudflare-ddns/pull/1282))


  See the full release history: https://github.com/favonia/cloudflare-ddns/releases

